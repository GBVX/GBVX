/* wg. "Beispiele" bei Luftfeuchtigkeit */
.markedPoint{
  outline: 3px solid #d1495b;

<body>

<script>
// Sättigungsdampfdichte (g/m^3) bei gegebener Temperatur (Magnus-Formel)
function saturationDensity(tempC){
  const es = 6.112 * Math.exp((17.62 * tempC) / (243.12 + tempC)); // hPa
  return 216.7 * es / (273.15 + tempC); // g/m^3
}

// Umkehrfunktion: Taupunkt-Temperatur, bei der saturationDensity(t) == h (g/m^3)
function dewPointTemp(h){
  let lo = -90, hi = 80;
  for(let i = 0; i < 60; i++){
    const mid = (lo + hi) / 2;
    if(saturationDensity(mid) < h){ lo = mid; } else { hi = mid; }
  }
  return (lo + hi) / 2;
}



// Examples

const EXAMPLE_GROUPS = [
  {
    name: 'Allgemeine Beispiele',                   // example=0-0
    items: [
        {
        label: 'abrupter Temperaturwechsel',// Aufruf mit: example=<Gruppenindex>-<Beispielindex>, z.B. ?example=0-0
        points: [
          { t: 5,  pct: 90, color:'blue'},          // Kühlschrank
          { t: 20, pct: 58, color:'DarkOrange' },   // Raumtemp. -- DarkOrange = color: '#FF8C00'
          { t: 30, pct: 60, color:'red' }           // Außentemp.
        ]
      }
    ]
  },

  {
    name: 'Spezielle Wetterlagen',                     // example=1-...
    items: [
      {
        label: 'schwüle Tage',                         // example=1-0
        rows: [ 
          { h: 13.5, color: 'DarkOrange' },
          ]
      },
      { 
        label: 'Beispiel: 34 °C, 60 % r.F.',          // example=1-1
        points: [ 
          { t: 34, pct: 60, color: '#CCCC00' } 
          ] 
      },
      { 
        label: 'Beispiel: 32 °C, 30 % r.F.',          // example=1-2
        points: [ 
          { t: 32, pct: 30, color: '#CCCC00' } 
          ] 
      },
    ]
  },

  {
    name: 'Gebäude', 
    items: [
      { label: 'Wohnraum: 20 °C, 58 % r.F.',          // example=2-0
        points: [ { t: 20, pct: 58, color: '#CC9966' } ] },
        { label: 'Schimmelrisiko: 16 °C, 90 % r.F.',  // example=2-1
        points: [ { t: 16, pct: 90, color: 'DarkGreen' } ] 
      },
      {
        label: 'Keller lüften',                       // example=2-2
        points: [
          { t: 24, pct: 50, color:'red' },            // Außentemp. 2
          { t: 16, pct: 70, color:'green'},           // Keller jetzt
          { t: 14, pct: 50, color:'blue' },           // Außentemp. 1    
        ]
      }, 
    ]
  }
];

// Feste Randfarben für die 3er-Vergleichsgruppe, nach Position (A, B, C).
// Reihenfolge entspricht der Reihenfolge in "points" pro Eintrag oben.
const TRIPLE_POINT_COLORS = ['blue', 'green', 'red', 'yellow'];

// Randfarbe für Einzelpunkte und 2er-Vergleiche
const DEFAULT_POINT_COLOR = '#d1495b';


function resolveExample(ex){
  let { t, h, pct } = ex;
  if(t !== undefined && h !== undefined){
    // beide Achsenwerte schon gegeben
  } else if(t !== undefined && pct !== undefined){
    h = saturationDensity(t) * pct / 100;
  } else if(h !== undefined && pct !== undefined){
    t = dewPointTemp(h * 100 / pct);
  } else {
    return null;
  }
  return { t, h };
}



function resolveItemPoints(item){
  const resolved = [];
  for(const raw of (item.points || [])){
    const pt = resolveExample(raw);
    if(!pt) return null;
    resolved.push({ t: pt.t, h: pt.h, color: raw.color });
  }
  return resolved;
}




function colorsForItem(count){
  if(count === 3) return TRIPLE_POINT_COLORS.slice(0, count);
  return new Array(count).fill(DEFAULT_POINT_COLOR);
}



function populateExamples(){
  const sel = document.getElementById('exampleSelect');
  sel.innerHTML = '<option value="">  </option>';  // Beispiele (Text im Auswahlmenü)
  EXAMPLE_GROUPS.forEach((group, gi) => {
    const optgroup = document.createElement('optgroup');
    optgroup.label = group.name;
    group.items.forEach((item, ii) => {
      const opt = document.createElement('option');
      opt.value = gi + '-' + ii;
      opt.textContent = item.label;
      optgroup.appendChild(opt);
    });
    sel.appendChild(optgroup);
  });
}


// Wendet einen Beispiel-Eintrag (1-3 Punkte) an. Wird sowohl vom Dropdown
// als auch von der URL-Parameter-Übergabe genutzt.


function applyExampleItem(groupIndex, itemIndex){
  const group = EXAMPLE_GROUPS[groupIndex];
  if(!group) return false;
  const item = group.items[itemIndex];
  if(!item) return false;

  const resolvedPoints = resolveItemPoints(item);
  if(!resolvedPoints) return false;

  const fallbackColors = colorsForGroup(resolvedPoints.length);

  function colorsForGroup(count){
  if(count === 3) return TRIPLE_POINT_COLORS.slice(0, count);
  return new Array(count).fill(DEFAULT_POINT_COLOR);
}
  clearSelection();

  markedPoints = resolvedPoints.map((pt, i) => ({
    t: pt.t,
    h: pt.h,
    label: item.label,
    color: pt.color || fallbackColors[i]
  }));

  markedRows = (item.rows || []).map(r => ({
  h: r.h,
  color: r.color,
  label: r.label || item.label
}));

  const tMinInput = document.getElementById('tMin');
  const tMaxInput = document.getElementById('tMax');
  const hMinInput = document.getElementById('hMin');
  const hMaxInput = document.getElementById('hMax');
  resolvedPoints.forEach(pt => {
    if(pt.t < parseFloat(tMinInput.value)) tMinInput.value = Math.floor(pt.t);
    if(pt.t > parseFloat(tMaxInput.value)) tMaxInput.value = Math.ceil(pt.t);
    if(pt.h < parseFloat(hMinInput.value)) hMinInput.value = Math.floor(pt.h);
    if(pt.h > parseFloat(hMaxInput.value)) hMaxInput.value = Math.ceil(pt.h);
  });
  markedRows.forEach(r => {
    if(r.h < parseFloat(hMinInput.value)) hMinInput.value = Math.floor(r.h);
    if(r.h > parseFloat(hMaxInput.value)) hMaxInput.value = Math.ceil(r.h);
  });

  build();

  // der letzte Punkt der Gruppe erhält zusätzlich die volle "T"-Markierung,
  // in seiner eigenen Farbe statt des festen Akzentwerts
  if(resolvedPoints.length){
  const activePt = resolvedPoints[resolvedPoints.length - 1];
  const activeColor = markedPoints[markedPoints.length - 1].color;
  document.documentElement.style.setProperty('--selectionColor', activeColor);
  const col = findNearestIndex(lastTemps, activePt.t);
  const row = findNearestIndex(lastHums, activePt.h);
  selectedColIndex = String(col);
  selectedRowIndex = String(row);
  }
  applySelection();

  const sel = document.getElementById('exampleSelect');
  if(sel) sel.value = groupIndex + '-' + itemIndex;

  return true;
}



// Übergabe der Parameter von HTML zur Grafik
// Format: ?example=<Gruppenindex>-<Beispielindex>, z.B. ?example=2-0
function applyExampleFromURL(){
  const params = new URLSearchParams(window.location.search);
  const val = params.get('example');
  if(val === null) return;
  const [gi, ii] = val.split('-').map(Number);
  if(Number.isNaN(gi) || Number.isNaN(ii)) return;
  applyExampleItem(gi, ii);
}
// ENDE Übergabe der Parameter von HTML zur Grafik

// ENDE Examples




function hexToRgb(hex){
  const v = hex.replace('#','');
  return {
    r: parseInt(v.substring(0,2),16),
    g: parseInt(v.substring(2,4),16),
    b: parseInt(v.substring(4,6),16)
  };
}

function mix(c1, c2, t){
  return {
    r: Math.round(c1.r + (c2.r - c1.r) * t),
    g: Math.round(c1.g + (c2.g - c1.g) * t),
    b: Math.round(c1.b + (c2.b - c1.b) * t)
  };
}

function colorForPct(pct, low, mid, high, optPct){
  let rgb;
  if(pct <= optPct){
    const t = pct / optPct;
    rgb = mix(low, mid, Math.max(0, Math.min(1, t)));
  } else {
    const t = (pct - optPct) / (100 - optPct);
    rgb = mix(mid, high, Math.max(0, Math.min(1, t)));
  }
  return `rgb(${rgb.r},${rgb.g},${rgb.b})`;
}

function textColorFor(rgbStr){
  const [r,g,b] = rgbStr.match(/\d+/g).map(Number);
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance > 0.6 ? '#111' : '#fff';
}

function range(min, max, step){
  const out = [];
  const n = Math.round((max - min) / step);
  for(let i=0;i<=n;i++){
    out.push(+(min + i*step).toFixed(2));
  }
  return out;
}

function fmtDE(n){
  return n.toLocaleString('de-DE', {maximumFractionDigits:2});
}

// nur für die Temperatur-Achse (x): immer ganzzahlig, keine Nachkommastellen
function fmtTemp(n){
  return Math.round(n).toLocaleString('de-DE', {maximumFractionDigits:0});
}

// ---- Auswahl-Status (Spalten-/Zellen-Hervorhebung) ----
let selectedColIndex = null;
let selectedRowIndex = null;

// ---- Zoom-Status (Flächenauswahl per Maus) ----
let lastTemps = [];
let lastHums = [];
let isDragging = false;
let dragStartClient = null;
let dragStartCell = null;
let lastHoverCell = null;
let suppressNextClick = false;
let dewCellEl = null; // aktuell markierte Taupunkt-Zelle auf der x-Achse
let markedPoints = [];  // wg. Datenübergabe der Beispiele
let markedRows = [];   // wg. frei einfärbbarer Zeilen-Hervorhebung pro Beispiel, z.B. bei 12g/m^3




function clearSelection(){
  document.querySelectorAll('.colSelected, .rowSelected').forEach(el=>{
    el.classList.remove('colSelected','rowSelected');
  });
  clearDewHighlight();
  selectedColIndex = null;
  selectedRowIndex = null;
  document.documentElement.style.removeProperty('--selectionColor');
}



function clearDewHighlight(){
  document.querySelectorAll('.dewSelected').forEach(el => {
    el.classList.remove('dewSelected');
    el.style.background = '';
    el.style.color = '';
    el.title = '';
  });
  dewCellEl = null;
}


function applySelection(){
  if(selectedRowIndex !== null){
    const tr = document.querySelector(`#grid tbody tr[data-row="${selectedRowIndex}"]`);
    if(tr){
      tr.querySelectorAll('td, th').forEach(el => {
        if(el.classList.contains('empty')) return;
        el.classList.add('rowSelected');
      });
    }
    markDewPoint(selectedRowIndex);
  }
  if(selectedColIndex !== null){
    const limitRow = selectedRowIndex !== null ? parseInt(selectedRowIndex, 10) : null;
    document.querySelectorAll(`#grid [data-col="${selectedColIndex}"]`).forEach(el=>{
      if(el.classList.contains('empty')) return;
      if(limitRow !== null){
        const rowTr = el.closest('tr');
        const rowAttr = rowTr ? rowTr.dataset.row : undefined;
        // Zeilen oberhalb des Punkts (kleinerer Index = höhere Luftfeuchtigkeit, weiter oben)
        // von der Spalten-Hervorhebung ausschließen. Die tfoot-Zelle (x-Achse) hat kein
        // dataset.row und bleibt dadurch immer eingefärbt = Fußpunkt des T-Stamms.
        if(rowAttr !== undefined && parseInt(rowAttr, 10) < limitRow) return;
      }
      el.classList.add('colSelected');
    });
  }
}






// markiert auf der x-Achse die Temperatur, bei der der Wassergehalt der gewählten
// Zeile die Sättigung (100 %) erreicht -> Taupunkt
function markDewPoint(rowIndex){
  if(!lastTemps.length || !lastHums.length) return;
  const h = lastHums[rowIndex];
  const dewT = dewPointTemp(h);

  let bestIdx = 0, bestDiff = Infinity;
  lastTemps.forEach((t, i) => {
    const diff = Math.abs(t - dewT);
    if(diff < bestDiff){ bestDiff = diff; bestIdx = i; }
  });

  const tStepVal = parseFloat(document.getElementById('tStep').value) || 1;
  if(bestDiff > tStepVal) return; // Taupunkt liegt außerhalb des sichtbaren Temperaturbereichs

  const footerCell = document.querySelector(`#grid tfoot td[data-col="${bestIdx}"]`);
  if(!footerCell) return;

  const lineHex = document.getElementById('colLine').value;
  const rgb = hexToRgb(lineHex);
  const bgStr = `rgb(${rgb.r},${rgb.g},${rgb.b})`;
  footerCell.classList.add('dewSelected');
  footerCell.style.background = bgStr;
  footerCell.style.color = textColorFor(bgStr);
  footerCell.title = `Taupunkt bei ${fmtDE(h)} g/m\u00b3: ${fmtDE(dewT)} \u00b0C`;
  dewCellEl = footerCell;
}



// wg. Datenübergabe Beispiele
function findNearestIndex(arr, value){
  let bestIdx = 0, bestDiff = Infinity;
  arr.forEach((v, i) => {
    const diff = Math.abs(v - value);
    if(diff < bestDiff){ bestDiff = diff; bestIdx = i; }
  });
  return bestIdx;
}

function clearMarkedPoints(){
  document.querySelectorAll('.markedPoint').forEach(el => {
    el.classList.remove('markedPoint');
    el.style.outlineColor = '';
    el.title = '';
  });
}

function applyMarkedPoints(){
  clearMarkedPoints();
  if(!lastTemps.length || !lastHums.length) return;

  const tLo = Math.min(...lastTemps), tHi = Math.max(...lastTemps);
  const hLo = Math.min(...lastHums), hHi = Math.max(...lastHums);

  markedPoints.forEach(p => {
    if(p.t < tLo - 1e-6 || p.t > tHi + 1e-6) return;
    if(p.h < hLo - 1e-6 || p.h > hHi + 1e-6) return;

    const col = findNearestIndex(lastTemps, p.t);
    const row = findNearestIndex(lastHums, p.h);
    const cell = document.querySelector(`#grid tbody tr[data-row="${row}"] td[data-col="${col}"]`);
    if(!cell || cell.classList.contains('empty')) return;

    cell.classList.add('markedPoint');
    cell.style.outlineColor = p.color || 'blue';
    if(p.label) cell.title = p.label;
  });
}


function applyMarkedRows(){  // für horizontale 12 g/m^3 Linie
  if(!markedRows.length || !lastHums.length) return;

  markedRows.forEach(row => {
    if(row.h < Math.min(...lastHums) - 1e-6 || row.h > Math.max(...lastHums) + 1e-6) return;
    const rowIndex = findNearestIndex(lastHums, row.h);
    const tr = document.querySelector(`#grid tbody tr[data-row="${rowIndex}"]`);
    if(!tr) return;

    tr.querySelectorAll('td, th').forEach(el => {
      if(el.classList.contains('empty')) return;
      el.classList.add('markedRow');
      el.style.setProperty('--marked-row-color', row.color || DEFAULT_POINT_COLOR);
    });
    if(row.label) tr.title = row.label;

    markDewPoint(rowIndex);
  });
}

function build(){
  const tMinInput = document.getElementById('tMin');
  const tMaxInput = document.getElementById('tMax');
  const TEMP_LIMIT_MIN = -45, TEMP_LIMIT_MAX = 65;
  let tMin = Math.min(Math.max(parseFloat(tMinInput.value), TEMP_LIMIT_MIN), TEMP_LIMIT_MAX);
  let tMax = Math.min(Math.max(parseFloat(tMaxInput.value), TEMP_LIMIT_MIN), TEMP_LIMIT_MAX);
  tMinInput.value = tMin;
  tMaxInput.value = tMax;
  const tStep = parseFloat(document.getElementById('tStep').value);
  const hMinInput = document.getElementById('hMin');
  let hMin = Math.max(parseFloat(hMinInput.value), 0);
  hMinInput.value = hMin;
  const hMax = parseFloat(document.getElementById('hMax').value);
  const hStep = parseFloat(document.getElementById('hStep').value);
  const optPct = parseFloat(document.getElementById('optPct').value);

  const low = hexToRgb(document.getElementById('colLow').value);
  const mid = hexToRgb(document.getElementById('colMid').value);
  const high = hexToRgb(document.getElementById('colHigh').value);
  const lineColor = document.getElementById('colLine').value;

  const temps = range(tMin, tMax, tStep);
  const hums = range(hMin, hMax, hStep).reverse();
  lastTemps = temps;
  lastHums = hums;

  const table = document.getElementById('grid');
  table.innerHTML = '';
  dewCellEl = null;

  const wrap = document.getElementById('gridWrap');
  const wrapOuter = document.querySelector('.wrap');
  const availW = wrapOuter.clientWidth;
  const availH = wrapOuter.clientHeight;
  const colCount = temps.length + 1;
  const rowCount = hums.length + 1;

  const MIN_FIT_W = 32, MIN_FIT_H = 20;
  const fitW = availW / colCount;
  const fitH = availH / rowCount;

  // Breite und Höhe unabhängig voneinander bestimmen: die Spalten sollen die
  // volle verfügbare Breite ausfüllen, auch wenn wegen vieler Zeilen vertikal
  // gescrollt werden muss (vorher koppelte eine gemeinsame if/else-Bedingung
  // beides, sodass ein kleinerer Temperaturbereich bei zu vielen Zeilen nicht
  // die ganze Seitenbreite nutzte).
  let cellW = Math.max(6, Math.floor(fitW));
  if(cellW < MIN_FIT_W) cellW = 44;
  let cellH = Math.max(6, fitH);
  if(cellH < MIN_FIT_H) cellH = 26;
  wrapOuter.classList.add('scroll-mode'); // steuert nur Sticky-Header/Auto-Sizing; ohne Überlauf erscheint ohnehin kein Scrollbalken
  const fontPx = Math.max(6, Math.min(cellW, cellH) * 0.42);

  document.documentElement.style.setProperty('--cell-w', cellW + 'px');
  document.documentElement.style.setProperty('--cell-h', cellH + 'px');
  document.documentElement.style.setProperty('--cell-font', fontPx + 'px');

  const tickFontPx = Math.max(9, Math.min(13, fontPx * 1.3));
  document.documentElement.style.setProperty('--tick-font', tickFontPx + 'px');

  const minRowLabelH = 15;
  const yLabelStep = Math.max(1, Math.ceil(minRowLabelH / cellH));



  function niceStep(rawStep){
    const candidates = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000];
    for(const c of candidates){ if(c >= rawStep) return c; }
    return Math.pow(10, Math.ceil(Math.log10(rawStep)));
  }
  const minColLabelW = 24;
  const rawColStepUnits = (minColLabelW / cellW) * tStep;
  const xStepUnits = niceStep(rawColStepUnits);

  const colgroup = document.createElement('colgroup');
  for(let i=0;i<colCount;i++){
    const col = document.createElement('col');
    col.style.width = cellW + 'px';
    colgroup.appendChild(col);
  }
  table.appendChild(colgroup);

  const tbody = document.createElement('tbody');

  hums.forEach((h, rowI) => {
    const tr = document.createElement('tr');
    tr.dataset.row = rowI;
    const rowTh = document.createElement('th');
    const forceLabel = Math.abs(h) < 1e-9 || (Number.isInteger(h) && h % 10 === 0);
    if(rowI % yLabelStep === 0 || rowI === hums.length - 1 || forceLabel){
      rowTh.textContent = fmtDE(h);
    }
    tr.appendChild(rowTh);

    temps.forEach((t, i) => {
      const sat = saturationDensity(t);
      const pct = (h / sat) * 100;
      const td = document.createElement('td');
      td.dataset.col = i;
      if(pct > 100.4){
        td.className = 'empty';
      } else {
        const p = Math.min(100, pct);
        const bg = colorForPct(p, low, mid, high, optPct);
        td.className = 'cell';
        td.style.background = bg;
        td.style.color = textColorFor(bg);
        if(cellW >= 22 && cellH >= 16){
          const span = document.createElement('span');
          span.className = 'pctText';
          span.textContent = Math.round(p) + '%';
          td.appendChild(span);
        }
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  const tfoot = document.createElement('tfoot');
  const footRow = document.createElement('tr');
  const footLabel = document.createElement('th');
  footLabel.textContent = '';
  footRow.appendChild(footLabel);
  temps.forEach((t, i) => {
    const td = document.createElement('td');
    td.dataset.col = i;
    const onNiceStep = Math.abs(t % xStepUnits) < 1e-6 || Math.abs(Math.abs(t % xStepUnits) - xStepUnits) < 1e-6;
    if(onNiceStep || i === 0 || i === temps.length - 1){
      td.textContent = fmtTemp(t);
    }
    footRow.appendChild(td);
  });
  tfoot.appendChild(footRow);
  table.appendChild(tfoot);

  if(selectedColIndex !== null && selectedColIndex >= temps.length){
    selectedColIndex = null;
    selectedRowIndex = null;
  }
  if(selectedRowIndex !== null && selectedRowIndex >= hums.length){
    selectedRowIndex = null;
  }
  applySelection();

  drawSaturationLine(temps, hums, hStep, lineColor);
  applyMarkedPoints();
  applyMarkedRows();   // neu

}








function drawSaturationLine(temps, hums, hStep, lineColor){
  const gridWrap = document.getElementById('gridWrap');
  const table = document.getElementById('grid');
  const svg = document.getElementById('lineOverlay');

  const w = table.offsetWidth;
  const hgt = table.offsetHeight;
  svg.setAttribute('width', w);
  svg.setAttribute('height', hgt);
  svg.innerHTML = '';

  const wrapRect = gridWrap.getBoundingClientRect();

  // y-Referenz: Mittelpunkte der ersten beiden Datenzeilen messen -> exakte Zeilenhöhe in px
  const bodyRows = table.querySelectorAll('tbody tr');
  if(bodyRows.length < 1) return;
  const th0 = bodyRows[0].querySelector('th').getBoundingClientRect();
  const y0 = th0.top + th0.height / 2 - wrapRect.top; // y-Position von hums[0] (höchster Wert, oberste Zeile)
  let rowHeightPx = th0.height;
  if(bodyRows.length > 1){
    const th1 = bodyRows[1].querySelector('th').getBoundingClientRect();
    rowHeightPx = th1.top - th0.top;
  }

  // x-Referenz: Mittelpunkte der Fußzeilen-Zellen (eine pro Temperatur-Spalte)
  const footCells = table.querySelectorAll('tfoot td');

  // sichtbarer Bereich = nur die Datenzeilen (Kopf- und Fußzeile ausgeschlossen)
  const topBound = y0 - rowHeightPx / 2;
  const bottomBound = y0 + (hums.length - 1) * rowHeightPx + rowHeightPx / 2;

  const points = [];
  temps.forEach((t, i) => {
    const sat = saturationDensity(t);
    const rowIndexFrac = (hums[0] - sat) / hStep; // gebrochene Position zwischen den Zeilen
    const y = y0 + rowIndexFrac * rowHeightPx;

    const r = footCells[i].getBoundingClientRect();
    const x = r.left + r.width / 2 - wrapRect.left;
    points.push({x, y});
  });

  // Segment gegen den sichtbaren Datenbereich clippen, damit die Linie exakt an der
  // obersten/untersten Zeile endet, statt in Kopf-/Fußzeile hineinzulaufen.
  function clipSegment(A, B, lo, hi){
    const dy = B.y - A.y;
    let tMin = 0, tMax = 1;
    if(dy === 0){
      if(A.y < lo - 1e-6 || A.y > hi + 1e-6) return null;
    } else {
      const tLo = (lo - A.y) / dy, tHi = (hi - A.y) / dy;
      tMin = Math.max(0, Math.min(tLo, tHi));
      tMax = Math.min(1, Math.max(tLo, tHi));
      if(tMin > tMax + 1e-6) return null;
    }
    const Pa = { x: A.x + tMin * (B.x - A.x), y: A.y + tMin * dy };
    const Pb = { x: A.x + tMax * (B.x - A.x), y: A.y + tMax * dy };
    return { Pa, Pb, aInside: tMin <= 1e-6, bInside: tMax >= 1 - 1e-6 };
  }

  const runs = [];
  let current = [];
  for(let i = 0; i < points.length - 1; i++){
    const clipped = clipSegment(points[i], points[i + 1], topBound, bottomBound);
    if(!clipped){
      if(current.length){ runs.push(current); current = []; }
      continue;
    }
    if(current.length === 0){
      current.push(clipped.Pa);
    } else if(!clipped.aInside){
      runs.push(current);
      current = [clipped.Pa];
    }
    current.push(clipped.Pb);
    if(!clipped.bInside){
      runs.push(current);
      current = [];
    }
  }
  if(current.length) runs.push(current);

  const ns = 'http://www.w3.org/2000/svg';
  runs.forEach(run => {
    const d = run.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', lineColor);
    path.setAttribute('stroke-width', '2.5');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(path);
  });

  points.forEach(p => {
    if(p.y < topBound - 0.01 || p.y > bottomBound + 0.01) return; // nur Punkte im sichtbaren Datenbereich zeichnen
    const dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('cx', p.x.toFixed(1));
    dot.setAttribute('cy', p.y.toFixed(1));
    dot.setAttribute('r', '2.5');
    dot.setAttribute('fill', lineColor);
    svg.appendChild(dot);
  });
}

      selectedRowIndex = null;
      applySelection();
    }
  } else if(td.classList.contains('cell')){

    const row = td.closest('tr').dataset.row;
    if(selectedColIndex === col && selectedRowIndex === row){

    } else {
      clearSelection();
      selectedColIndex = col;
      selectedRowIndex = row;
      applySelection();
    }
  }
});

const zoomRectEl = document.getElementById('zoomRect');

// liefert {col, row} der Datenzelle unter dem Mauszeiger, oder null außerhalb des Datenbereichs
function cellAt(clientX, clientY){
  const el = document.elementFromPoint(clientX, clientY);
  if(!el) return null;
  const td = el.closest('#grid tbody td[data-col]');
  if(!td) return null;
  const tr = td.closest('tr');
  if(!tr || tr.dataset.row === undefined) return null;
  return { col: +td.dataset.col, row: +tr.dataset.row };
}

function updateZoomRect(a, b){
  const wrapRect = document.getElementById('gridWrap').getBoundingClientRect();
  const x1 = Math.min(a.x, b.x) - wrapRect.left;
  const y1 = Math.min(a.y, b.y) - wrapRect.top;
  const x2 = Math.max(a.x, b.x) - wrapRect.left;
  const y2 = Math.max(a.y, b.y) - wrapRect.top;
  zoomRectEl.style.left = x1 + 'px';
  zoomRectEl.style.top = y1 + 'px';
  zoomRectEl.style.width = (x2 - x1) + 'px';
  zoomRectEl.style.height = (y2 - y1) + 'px';
}

function applyZoom(startCell, endCell){
  const minCol = Math.min(startCell.col, endCell.col);
  const maxCol = Math.max(startCell.col, endCell.col);
  const minRow = Math.min(startCell.row, endCell.row);
  const maxRow = Math.max(startCell.row, endCell.row);
  if(minCol === maxCol && minRow === maxRow) return; // zu kleine Auswahl -> kein Zoom

  const tMinNew = lastTemps[minCol];
  const tMaxNew = lastTemps[maxCol];
  const hMinNew = lastHums[maxRow];  // Zeilen sind absteigend sortiert (höchster Wert oben)
  const hMaxNew = lastHums[minRow];

  document.getElementById('tMin').value = tMinNew;
  document.getElementById('tMax').value = tMaxNew;
  document.getElementById('hMin').value = hMinNew;
  document.getElementById('hMax').value = hMaxNew;

  clearSelection();
  build();
}

function onDragMove(e){
  const dx = e.clientX - dragStartClient.x;
  const dy = e.clientY - dragStartClient.y;
  if(!isDragging && Math.hypot(dx, dy) > 4){
    isDragging = true;
    zoomRectEl.style.display = 'block';
    document.body.classList.add('no-select');
  }
  if(isDragging){
    updateZoomRect(dragStartClient, { x: e.clientX, y: e.clientY });
    const c = cellAt(e.clientX, e.clientY);
    if(c) lastHoverCell = c;
  }
}

function onDragEnd(e){
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);
  document.body.classList.remove('no-select');
  zoomRectEl.style.display = 'none';

  if(isDragging){
    suppressNextClick = true;
    const endCell = cellAt(e.clientX, e.clientY) || lastHoverCell || dragStartCell;
    applyZoom(dragStartCell, endCell);
  }
  isDragging = false;
}

/* ============================================================
   Export (SVG / PNG) — exportiert NUR die Daten (Achsen + Tabelle
   + 100%-Linie), nicht das Menü/Bedienfeld darüber.

   Der Export wird als natives SVG (echte <rect>/<text>-Elemente)
   aus den Live-Zelldaten aufgebaut, statt die HTML-Tabelle per
   <foreignObject> einzubetten. foreignObject-basierte SVGs werden
   von vielen Betrachtern beim Verkleinern/Skalieren nicht neu
   gelayoutet (Text verschwindet, Inhalte werden abgeschnitten) und
   lösen in Chrome zudem eine Canvas-Sicherheitssperre beim
   PNG-Export aus. Natives SVG skaliert dagegen verlustfrei und
   lässt sich gefahrlos in ein <canvas> zeichnen.
   ============================================================ */

const SVG_NS = 'http://www.w3.org/2000/svg';

function escapeXml(str){
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

function svgText(text, x, y, opts){
  const { fontSize, fill, anchor = 'middle', weight = 400, fontFamily } = opts;
  return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-family="${fontFamily}" `
    + `font-size="${fontSize}" fill="${fill}" text-anchor="${anchor}" `
    + `dominant-baseline="central" font-weight="${weight}">${escapeXml(text)}</text>`;
}

// Baut das Datenraster (Zeilenbeschriftung, Zellen, Fußzeile, 100%-Linie)
// rein arithmetisch aus den aktuellen Zellwerten — table-layout:fixed
// garantiert, dass jede Spalte/Zeile exakt --cell-w/--cell-h groß ist.
function buildGridSvgFragment(){
  const cs = getComputedStyle(document.documentElement);
  const num = (name, fallback) => parseFloat(cs.getPropertyValue(name)) || fallback;
  const col = name => (cs.getPropertyValue(name).trim() || '');

  const cellW = num('--cell-w', 44);
  const cellH = num('--cell-h', 26);
  const cellFont = num('--cell-font', 12);
  const tickFont = num('--tick-font', 11);
  const lineColor = col('--line') || '#cdd6d9';
  const panelColor = col('--panel') || '#e7ecee';
  const mutedColor = col('--muted') || '#5d6b73';
  const monoFont = (col('--mono') || 'monospace').replace(/"/g, "'");

  const numCols = lastTemps.length;
  const numRows = lastHums.length;
  const gridW = cellW * (numCols + 1);
  const gridH = cellH * (numRows + 1);

  const parts = [];
  const cs2 = getComputedStyle(document.documentElement);
  const selectionColor = (cs2.getPropertyValue('--selectionColor').trim() || cs2.getPropertyValue('--accent').trim() || '#1f7d91');

  // Rand-Highlight (Zeilen-/Spaltenauswahl, "Beispiele"-Markierungen) als zusätzliches
  // Rahmen-Rect nachbilden — CSS nutzt dafür box-shadow/outline, was foreignObject-frei
  // (also im nativen SVG) nicht direkt existiert.
  function selectionBorders(el){
    const out = [];
    if(el.classList.contains('rowSelected')){
      out.push({ color: selectionColor, width: 2, inset: 1 });
    }
    if(el.classList.contains('colSelected')){
      out.push({ color: selectionColor, width: 2, inset: 1 });
    }
    if(el.classList.contains('markedPoint')){
      out.push({ color: el.style.outlineColor || '#d1495b', width: 3, inset: 1.5 });
    }
    if(el.classList.contains('markedRow')){
      const c = el.style.getPropertyValue('--marked-row-color') || '#d1495b';
      out.push({ color: c, width: 2, inset: 1 });
    }
    return out;
  }

  function borderRects(x, y, w, h, el){
    return selectionBorders(el).map(b =>
      `<rect x="${x + b.inset}" y="${y + b.inset}" width="${w - b.inset * 2}" height="${h - b.inset * 2}" `
      + `fill="none" stroke="${b.color}" stroke-width="${b.width}"/>`
    ).join('');
  }

  parts.push(`<rect x="0" y="0" width="${gridW}" height="${gridH}" fill="${panelColor}"/>`);

  // 100%-Sättigungslinie: direkt nach dem Hintergrund und VOR den Datenzellen
  // gezeichnet, damit gefüllte Zellen (Hintergrund + Prozentzahl) sie beim
  // Export überdecken, genau wie jetzt auch auf der Live-Seite (td.cell liegt
  // per z-index über dem Overlay). In leeren Zellen (kein fill) bleibt sie
  // weiterhin sichtbar.
  parts.push(buildSaturationLineSvg(cellW, cellH));

  const table = document.getElementById('grid');
  table.querySelectorAll('tbody > tr').forEach(tr => {
    const rowI = +tr.dataset.row;
    const y = rowI * cellH;
    const th = tr.querySelector('th');
    if(th && th.textContent){
      const thHighlighted = th.classList.contains('rowSelected') || th.classList.contains('markedRow');
      if(thHighlighted){
        const thBg = th.classList.contains('markedRow')
          ? (th.style.getPropertyValue('--marked-row-color') || '#d1495b')
          : selectionColor;
        parts.push(`<rect x="0" y="${y}" width="${cellW}" height="${cellH}" fill="${thBg}"/>`);
      }
      parts.push(svgText(th.textContent, 6, y + cellH / 2, {
        fontSize: tickFont, fill: thHighlighted ? '#fff' : mutedColor, anchor: 'start', weight: 600, fontFamily: monoFont
      }));
    }
    tr.querySelectorAll('td').forEach(td => {
      const colI = +td.dataset.col;
      const x = (colI + 1) * cellW;
      const isEmpty = td.classList.contains('empty');
      if(isEmpty){
        // kein Fill -> die zuvor gezeichnete Linie bleibt hier sichtbar, nur der Rahmen wird nachgezogen
        parts.push(`<rect x="${x}" y="${y}" width="${cellW}" height="${cellH}" fill="none" stroke="${lineColor}" stroke-width="1"/>`);
        return;
      }
      const bg = td.style.background || panelColor;
      parts.push(`<rect x="${x}" y="${y}" width="${cellW}" height="${cellH}" fill="${bg}" stroke="${lineColor}" stroke-width="1"/>`);
      parts.push(borderRects(x, y, cellW, cellH, td));
      const span = td.querySelector('.pctText');
      if(span && span.textContent){
        const txtColor = td.style.color || '#111';
        parts.push(svgText(span.textContent, x + cellW / 2, y + cellH / 2, {
          fontSize: cellFont, fill: txtColor, weight: 700, fontFamily: monoFont
        }));
      }
    });
  });

  const footRow = table.querySelector('tfoot > tr');
  if(footRow){
    const y = numRows * cellH;
    parts.push(`<rect x="0" y="${y}" width="${cellW}" height="${cellH}" fill="${panelColor}" stroke="${lineColor}" stroke-width="1"/>`);
    footRow.querySelectorAll('td').forEach(td => {
      const colI = +td.dataset.col;
      const x = (colI + 1) * cellW;
      // Priorität wie im Original-CSS: Spaltenauswahl (!important) schlägt die
      // inline gesetzte Taupunkt-Hintergrundfarbe.
      let bg = panelColor, txtColor = mutedColor;
      if(td.classList.contains('colSelected')){
        bg = selectionColor; txtColor = '#fff';
      } else if(td.style.background){
        bg = td.style.background; txtColor = td.style.color || mutedColor;
      }
      parts.push(`<rect x="${x}" y="${y}" width="${cellW}" height="${cellH}" fill="${bg}" stroke="${lineColor}" stroke-width="1"/>`);
      if(td.textContent){
        parts.push(svgText(td.textContent, x + cellW / 2, y + cellH / 2, {
          fontSize: tickFont, fill: txtColor, weight: 600, fontFamily: monoFont
        }));
      }
    });
  }

  return { fragment: parts.join(''), width: gridW, height: gridH };
}

function buildSaturationLineSvg(cellW, cellH){
  if(!lastTemps.length || lastHums.length < 1) return '';
  const lineColor = document.getElementById('colLine').value;
  const hStep = lastHums.length > 1 ? Math.abs(lastHums[1] - lastHums[0]) : 1;

  const y0 = cellH / 2; // Mittelpunkt der obersten Datenzeile (höchster Wassergehalt)
  const points = lastTemps.map((t, i) => {
    const sat = saturationDensity(t);
    const rowIndexFrac = (lastHums[0] - sat) / hStep;
    const y = y0 + rowIndexFrac * cellH;
    const x = (i + 1) * cellW + cellW / 2; // Mitte der Datenspalte i (wie tfoot-Zelle)
    return { x, y };
  });

  const topBound = y0 - cellH / 2;
  const bottomBound = y0 + (lastHums.length - 1) * cellH + cellH / 2;

  function clipSegment(A, B, lo, hi){
    const dy = B.y - A.y;
    let tMin = 0, tMax = 1;
    if(dy === 0){
      if(A.y < lo - 1e-6 || A.y > hi + 1e-6) return null;
    } else {
      const tLo = (lo - A.y) / dy, tHi = (hi - A.y) / dy;
      tMin = Math.max(0, Math.min(tLo, tHi));
      tMax = Math.min(1, Math.max(tLo, tHi));
      if(tMin > tMax + 1e-6) return null;
    }
    const Pa = { x: A.x + tMin * (B.x - A.x), y: A.y + tMin * dy };
    const Pb = { x: A.x + tMax * (B.x - A.x), y: A.y + tMax * dy };
    return { Pa, Pb, aInside: tMin <= 1e-6, bInside: tMax >= 1 - 1e-6 };
  }

  const runs = [];
  let current = [];
  for(let i = 0; i < points.length - 1; i++){
    const clipped = clipSegment(points[i], points[i + 1], topBound, bottomBound);
    if(!clipped){
      if(current.length){ runs.push(current); current = []; }
      continue;
    }
    if(current.length === 0){
      current.push(clipped.Pa);
    } else if(!clipped.aInside){
      runs.push(current);
      current = [clipped.Pa];
    }
    current.push(clipped.Pb);
    if(!clipped.bInside){
      runs.push(current);
      current = [];
    }
  }
  if(current.length) runs.push(current);

  const parts = [];
  runs.forEach(run => {
    const d = run.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
    parts.push(`<path d="${d}" fill="none" stroke="${lineColor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`);
  });
  points.forEach(p => {
    if(p.y < topBound - 0.01 || p.y > bottomBound + 0.01) return;
    parts.push(`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="${lineColor}"/>`);
  });

  return parts.join('');
}

function buildExportSvgString(){
  const cs = getComputedStyle(document.documentElement);
  const bgColor = cs.getPropertyValue('--bg').trim() || '#f4f6f7';
  const lineColor = cs.getPropertyValue('--line').trim() || '#cdd6d9';
  const mutedColor = cs.getPropertyValue('--muted').trim() || '#5d6b73';
  const sansFont = (cs.getPropertyValue('--sans').trim() || 'sans-serif').replace(/"/g, "'");

  const { fragment, width: gridW, height: gridH } = buildGridSvgFragment();

  const padding = 16;
  const yAxisW = 22;
  const gap = 8;
  const xAxisLabelEl = document.querySelector('.xAxisLabel');
  const xAxisH = (xAxisLabelEl && xAxisLabelEl.offsetHeight) || 32;

  const gridOriginX = padding + yAxisW + gap;
  const gridOriginY = padding;

  const totalW = gridOriginX + gridW + padding;
  const totalH = gridOriginY + gridH + gap + xAxisH + padding;

  const yLabelText = (document.querySelector('.yAxisLabel')?.textContent || '').trim();
  const xLabelText = (xAxisLabelEl?.textContent || '').trim();

  const yCx = padding + yAxisW / 2;
  const yCy = gridOriginY + gridH / 2;
  const xCx = gridOriginX + gridW / 2;
  const xCy = gridOriginY + gridH + gap + xAxisH / 2;

  const svg = [];
  svg.push(`<svg xmlns="${SVG_NS}" width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}">`);
  svg.push(`<rect x="0" y="0" width="${totalW}" height="${totalH}" fill="${bgColor}"/>`);
  // y-Achsen-Beschriftung (vertikal, von unten nach oben lesbar wie im Original)
  svg.push(`<text x="${yCx}" y="${yCy}" font-family="${sansFont}" font-size="14" fill="${mutedColor}" `
    + `text-anchor="middle" dominant-baseline="central" transform="rotate(-90 ${yCx} ${yCy})">${escapeXml(yLabelText)}</text>`);
  // Rahmen um das Datenraster (entspricht .wrap-Border, unten offen)
  svg.push(`<path d="M${gridOriginX},${gridOriginY + gridH} V${gridOriginY} H${gridOriginX + gridW} V${gridOriginY + gridH}" `
    + `fill="none" stroke="${lineColor}" stroke-width="1"/>`);
  svg.push(`<g transform="translate(${gridOriginX},${gridOriginY})">${fragment}</g>`);
  // x-Achsen-Beschriftung
  svg.push(`<text x="${xCx}" y="${xCy}" font-family="${sansFont}" font-size="14" fill="${mutedColor}" `
    + `text-anchor="middle" dominant-baseline="central">${escapeXml(xLabelText)}</text>`);
  svg.push('</svg>');

  return { svgString: svg.join(''), width: totalW, height: totalH };
}

function triggerDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportSvg(){
  const { svgString } = buildExportSvgString();
  const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
  triggerDownload(blob, 'luftfeuchtigkeit.svg');
}

function exportPng(){
  const { svgString, width, height } = buildExportSvgString();
  const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(svgBlob);

  const img = new Image();
  img.onload = () => {
    const scale = 2; // schärferer Export (Retina)
    const canvas = document.createElement('canvas');
    canvas.width = width * scale;
    canvas.height = height * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, width, height);
    URL.revokeObjectURL(url);
    canvas.toBlob(blob => {
      if(blob) triggerDownload(blob, 'luftfeuchtigkeit.png');
      else alert('PNG-Export fehlgeschlagen.');
    }, 'image/png');
  };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    alert('PNG-Export fehlgeschlagen.');
  };
  img.src = url;
}

document.getElementById('exportSvgBtn').addEventListener('click', exportSvg);
document.getElementById('exportPngBtn').addEventListener('click', exportPng);

build();
</script>

}
window.addEventListener('load', sendHeight);
window.addEventListener('resize', sendHeight);
new ResizeObserver(sendHeight).observe(document.body);

populateExamples();
